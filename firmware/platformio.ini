; Stackchan Strider ファームウェア(M5Stack 製品版スタックチャン K151 / CoreS3)
[platformio]
default_envs = stackchan

[env:stackchan]
; 公式の StackChan-BSP は Arduino-ESP32 3 系(ESP-IDF 5)が前提。PlatformIO 標準の環境は 2 系なので pioarduino を使う
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.partitions = partitions_stackchan.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
build_unflags = -std=gnu++11
; バイナリに埋め込まれるソースのパスから、ビルドしたパソコンのフォルダ名を消す
extra_scripts = pre:strip_paths.py
build_src_filter = +<*> -<controller/>
lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX
    https://github.com/m5stack/StackChan-BSP.git
    crankyoldgit/IRremoteESP8266
    m5stack/M5Unit-NFC
    meganetaaan/M5Stack-Avatar
    h2zero/NimBLE-Arduino@^2.3.0
; Atom コントローラー(AtomS3 + Grove Thumb Joystick)。pio run -e controller -t upload
[env:controller]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
    -DCTL_PIN_X=8
    -DCTL_PIN_Y=7
build_unflags = -std=gnu++11
extra_scripts = pre:strip_paths.py
build_src_filter = -<*> +<controller/main.cpp> +<controller/input_joystick.cpp> +<stick_link.cpp>
lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX

; 同じコントローラーを、古い M5StickC(ESP32-PICO-D4、電池内蔵)で。pio run -e controller_stickc -t upload
; X は Grove 端子の黄(G32)、Y は白(G33)。電源の赤は上の端子の 3V3 から取る
[env:controller_stickc]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stick-c
; ボードの定義の variant 名(m5stick_c)が、Arduino-ESP32 3 系のフォルダ名(m5stack_stickc)と合わないので直す
board_build.variant = m5stack_stickc
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
    -DCTL_PIN_X=32
    -DCTL_PIN_Y=33
build_unflags = -std=gnu++11
extra_scripts = pre:strip_paths.py
build_src_filter = -<*> +<controller/main.cpp> +<controller/input_joystick.cpp> +<stick_link.cpp>
lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX

; 同じコントローラーを、M5Stack StopWatch(ESP32-S3、450mAh)で。画面のタッチと本体の傾きで操作する(配線なし)
; pio run -e controller_stopwatch -t upload
[env:controller_stopwatch]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32s3box
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -std=gnu++17
build_unflags = -std=gnu++11
extra_scripts = pre:strip_paths.py
build_src_filter = -<*> +<controller/main.cpp> +<controller/input_stopwatch.cpp> +<stick_link.cpp>
lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX

; 機器に依存しない部品(HID の記述子の読み取り)の単体テスト: pio test -e native
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<hid_parser.cpp> +<car_control.cpp> +<stick_link.cpp>
build_flags = -std=gnu++17 -Wall -Wextra
